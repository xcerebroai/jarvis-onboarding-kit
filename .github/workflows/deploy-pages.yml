name: Deploy dashboard to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare client resources
        run: |
          mkdir -p _site
          for page in index.html 01-client-intake-form.html 02-pre-install-access-checklist.html 04-client-handoff-playbook.html client-checklist.html client-setup-checklist.html setup-checklist.html; do
            cp "docs-html-branded/$page" "_site/$page"
          done
      - name: Upload client resources as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
